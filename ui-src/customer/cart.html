<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1">
  <title>购物车</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="customer.css">
</head>
<body>
  <div class="screen">
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons" aria-hidden="true">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
          <rect x="0" y="7" width="3" height="4" rx="1" fill="#111827"/>
          <rect x="4.5" y="5" width="3" height="6" rx="1" fill="#111827"/>
          <rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#111827"/>
          <rect x="13.5" y="0" width="3" height="11" rx="1" fill="#111827"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <path d="M1 4.5C3 2.5 5.3 1.5 8 1.5C10.7 1.5 13 2.5 15 4.5" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M3.5 7C4.9 5.7 6.3 5 8 5C9.7 5 11.1 5.7 12.5 7" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="8" cy="9.8" r="1.2" fill="#111827"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
          <rect x="0.5" y="1" width="21" height="10" rx="3" stroke="#111827" stroke-opacity="0.4"/>
          <rect x="2" y="2.5" width="17" height="7" rx="1.8" fill="#111827"/>
          <path d="M23 4V8C23.8 7.7 24.3 7 24.3 6C24.3 5 23.8 4.3 23 4Z" fill="#111827" fill-opacity="0.4"/>
        </svg>
      </div>
    </div>

    <div class="nav-bar">
      <a class="back-btn" href="store.html" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18L9 12L15 6"/>
        </svg>
      </a>
      <div class="nav-title">购物车</div>
      <div class="nav-action">清空</div>
    </div>

    <main class="page">
      <div class="cart-page">
        <div class="card cart-store">
          <div class="cart-store-head">
            <h3>川味小厨</h3>
            <span>已选 3 件</span>
          </div>

          <div class="cart-item">
            <div class="cart-item-img" style="background: linear-gradient(135deg, #FF9A2E, #FF6B2C);">鸡</div>
            <div class="cart-item-info">
              <h4>宫保鸡丁</h4>
              <p>微辣 · 花生</p>
              <div class="cart-item-price">¥22</div>
            </div>
            <div class="stepper">
              <button type="button" aria-label="减少数量">−</button>
              <span>1</span>
              <button class="plus" type="button" aria-label="增加数量">+</button>
            </div>
          </div>

          <div class="cart-item">
            <div class="cart-item-img" style="background: linear-gradient(135deg, #FCD34D, #F59E0B);">饭</div>
            <div class="cart-item-info">
              <h4>米饭</h4>
              <p>东北大米</p>
              <div class="cart-item-price">¥2</div>
            </div>
            <div class="stepper">
              <button type="button" aria-label="减少数量">−</button>
              <span>2</span>
              <button class="plus" type="button" aria-label="增加数量">+</button>
            </div>
          </div>
        </div>

        <div class="card summary-card">
          <div class="summary-line">
            <span>商品小计</span>
            <strong>¥26</strong>
          </div>
          <div class="summary-line">
            <span>配送费</span>
            <strong>¥2</strong>
          </div>
          <div class="summary-line total">
            <span>合计</span>
            <strong>¥28</strong>
          </div>
        </div>
      </div>
    </main>

    <div class="bottom-bar">
      <div>
        <div class="total">合计</div>
        <div class="amount"><small>¥</small>28</div>
      </div>
      <a class="btn-primary" href="checkout.html">去结算</a>
    </div>
  </div>
</body>
</html>
