<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1">
  <title>退款/售后</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="customer.css">
</head>
<body>
  <div class="screen">
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons" aria-hidden="true">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
          <rect x="0" y="7" width="3" height="4" rx="1" fill="#111827"/>
          <rect x="4.5" y="5" width="3" height="6" rx="1" fill="#111827"/>
          <rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#111827"/>
          <rect x="13.5" y="0" width="3" height="11" rx="1" fill="#111827"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <path d="M1 4.5C3 2.5 5.3 1.5 8 1.5C10.7 1.5 13 2.5 15 4.5" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M3.5 7C4.9 5.7 6.3 5 8 5C9.7 5 11.1 5.7 12.5 7" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="8" cy="9.8" r="1.2" fill="#111827"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
          <rect x="0.5" y="1" width="21" height="10" rx="3" stroke="#111827" stroke-opacity="0.4"/>
          <rect x="2" y="2.5" width="17" height="7" rx="1.8" fill="#111827"/>
          <path d="M23 4V8C23.8 7.7 24.3 7 24.3 6C24.3 5 23.8 4.3 23 4Z" fill="#111827" fill-opacity="0.4"/>
        </svg>
      </div>
    </div>

    <div class="nav-bar">
      <a class="back-btn" href="orders.html" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18L9 12L15 6"/>
        </svg>
      </a>
      <div class="nav-title">退款/售后</div>
      <div class="nav-action">客服</div>
    </div>

    <main class="page">
      <div class="refund-page">
        <div class="card refund-order">
          <div class="refund-order-head">
            <h3>川味小厨</h3>
            <span class="tag tag-orange">待接单</span>
          </div>
          <div class="refund-order-item">
            <div class="refund-order-img" style="background: linear-gradient(135deg, #FF9A2E, #FF6B2C);">鸡</div>
            <div class="refund-order-info">
              <h4>宫保鸡丁 x1</h4>
              <p>订单号：202610310001</p>
              <span class="price">¥22</span>
            </div>
          </div>
        </div>

        <div class="card reason-card">
          <h3>退款原因</h3>
          <label class="reason-option">
            <span>不想要了</span>
            <input type="radio" name="reason" checked>
          </label>
          <label class="reason-option">
            <span>地址填错了</span>
            <input type="radio" name="reason">
          </label>
          <label class="reason-option">
            <span>商家迟迟不接单</span>
            <input type="radio" name="reason">
          </label>
          <label class="reason-option">
            <span>其他原因</span>
            <input type="radio" name="reason">
          </label>
        </div>

        <div class="card refund-summary">
          <h3>退款金额</h3>
          <div class="summary-line">
            <span>商品金额</span>
            <strong>¥22</strong>
          </div>
          <div class="summary-line">
            <span>配送费</span>
            <strong>¥2</strong>
          </div>
          <div class="summary-line total">
            <span>退款合计</span>
            <strong>¥24</strong>
          </div>
          <p class="refund-note">已取餐或已送达时，配送费不退，具体以审核结果为准。</p>
        </div>
      </div>
    </main>

    <div class="bottom-bar">
      <div>
        <div class="total">退款合计</div>
        <div class="amount"><small>¥</small>24</div>
      </div>
      <a class="btn-primary" href="orders.html">提交申请</a>
    </div>
  </div>
</body>
</html>
