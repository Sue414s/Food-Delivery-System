<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1">
  <title>顾客注册</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="screen">
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons" aria-hidden="true">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
          <rect x="0" y="7" width="3" height="4" rx="1" fill="#111827"/>
          <rect x="4.5" y="5" width="3" height="6" rx="1" fill="#111827"/>
          <rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#111827"/>
          <rect x="13.5" y="0" width="3" height="11" rx="1" fill="#111827"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <path d="M1 4.5C3 2.5 5.3 1.5 8 1.5C10.7 1.5 13 2.5 15 4.5" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M3.5 7C4.9 5.7 6.3 5 8 5C9.7 5 11.1 5.7 12.5 7" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="8" cy="9.8" r="1.2" fill="#111827"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
          <rect x="0.5" y="1" width="21" height="10" rx="3" stroke="#111827" stroke-opacity="0.4"/>
          <rect x="2" y="2.5" width="17" height="7" rx="1.8" fill="#111827"/>
          <path d="M23 4V8C23.8 7.7 24.3 7 24.3 6C24.3 5 23.8 4.3 23 4Z" fill="#111827" fill-opacity="0.4"/>
        </svg>
      </div>
    </div>

    <div class="nav-bar">
      <button class="back-btn" type="button" aria-label="返回" onclick="history.length > 1 ? history.back() : null">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18L9 12L15 6"/>
        </svg>
      </button>
      <div class="nav-title">注册</div>
      <div></div>
    </div>

    <main class="content">
      <section class="brand">
        <div class="logo">外卖</div>
        <h1>注册外卖账号</h1>
        <p>手机号注册，立即开始点餐</p>
      </section>

      <form class="form-card" id="registerForm" novalidate>
        <div class="field" id="phoneField">
          <label for="phone">手机号</label>
          <div class="input-wrap">
            <span class="prefix">+86</span>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <rect x="7" y="2.5" width="10" height="19" rx="2.5"/>
              <path d="M10.5 18.5H13.5"/>
            </svg>
            <input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号" autocomplete="tel">
          </div>
          <div class="error-msg" id="phoneError"></div>
        </div>

        <div class="field" id="passwordField">
          <label for="password">密码</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2.5"/>
              <path d="M8 10V7.5C8 5.3 9.8 3.5 12 3.5C14.2 3.5 16 5.3 16 7.5V10"/>
              <path d="M12 14V16.5"/>
            </svg>
            <input id="password" name="password" type="password" maxlength="20" placeholder="设置密码（6-20 位）" autocomplete="new-password">
            <button class="eye-btn" type="button" data-target="password" aria-label="显示密码">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 12S6 5.5 12 5.5S21.5 12 21.5 12S18 18.5 12 18.5S2.5 12 2.5 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3L21 21"/>
                <path d="M10.6 6.1C11.1 6 11.5 6 12 6C18 6 21.5 12 21.5 12C20.6 13.5 19.5 14.7 18.2 15.6"/>
                <path d="M6.2 6.9C4 8.5 2.5 12 2.5 12S6 18 12 18C13.3 18 14.5 17.7 15.6 17.2"/>
                <path d="M9.9 9.9C9.4 10.5 9 11.2 9 12C9 13.7 10.3 15 12 15C12.8 15 13.5 14.6 14.1 14.1"/>
              </svg>
            </button>
          </div>
          <div class="error-msg" id="passwordError"></div>
        </div>

        <div class="field" id="confirmField">
          <label for="confirmPassword">确认密码</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2.5"/>
              <path d="M8 10V7.5C8 5.3 9.8 3.5 12 3.5C14.2 3.5 16 5.3 16 7.5V10"/>
              <path d="M12 14V16.5"/>
            </svg>
            <input id="confirmPassword" name="confirmPassword" type="password" maxlength="20" placeholder="再次输入密码" autocomplete="new-password">
            <button class="eye-btn" type="button" data-target="confirmPassword" aria-label="显示密码">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 12S6 5.5 12 5.5S21.5 12 21.5 12S18 18.5 12 18.5S2.5 12 2.5 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3L21 21"/>
                <path d="M10.6 6.1C11.1 6 11.5 6 12 6C18 6 21.5 12 21.5 12C20.6 13.5 19.5 14.7 18.2 15.6"/>
                <path d="M6.2 6.9C4 8.5 2.5 12 2.5 12S6 18 12 18C13.3 18 14.5 17.7 15.6 17.2"/>
                <path d="M9.9 9.9C9.4 10.5 9 11.2 9 12C9 13.7 10.3 15 12 15C12.8 15 13.5 14.6 14.1 14.1"/>
              </svg>
            </button>
          </div>
          <div class="error-msg" id="confirmError"></div>
        </div>

        <label class="agreement">
          <input type="checkbox" id="agreement">
          <span>我已阅读并同意 <a href="#">《用户协议》</a> 和 <a href="#">《隐私政策》</a></span>
        </label>

        <button class="submit-btn" type="submit" id="submitBtn">
          <span class="spinner" aria-hidden="true"></span>
          <span id="submitText">注册</span>
        </button>

        <div class="links">
          <div>已有账号？<a class="link-primary" href="#">去登录</a></div>
          <a class="link-muted" href="#">
            我是商家，去入驻申请
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 18L15 12L9 6"/>
            </svg>
          </a>
        </div>
      </form>
    </main>

    <div class="toast" id="toast">注册成功，请前往登录</div>
    <div class="home-indicator"></div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const phone = document.getElementById('phone');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submitBtn');
    const submitText = document.getElementById('submitText');
    const agreement = document.getElementById('agreement');
    const toast = document.getElementById('toast');
    const params = new URLSearchParams(window.location.search);
    let duplicatePhone = false;

    function setError(name, message) {
      const field = document.getElementById(name + 'Field');
      const error = document.getElementById(name + 'Error');
      field.classList.add('has-error');
      error.textContent = message;
    }

    function clearError(name) {
      const field = document.getElementById(name + 'Field');
      const error = document.getElementById(name + 'Error');
      field.classList.remove('has-error');
      error.textContent = '';
    }

    function validatePhone() {
      const value = phone.value.trim();
      if (!value) {
        setError('phone', '请输入手机号');
        return false;
      }
      if (!/^1[3-9]\d{9}$/.test(value)) {
        setError('phone', '请输入正确的 11 位手机号');
        return false;
      }
      if (duplicatePhone) {
        setError('phone', '该手机号已注册，请直接登录');
        return false;
      }
      clearError('phone');
      return true;
    }

    function validatePassword() {
      const value = password.value;
      if (!value) {
        setError('password', '请设置密码');
        return false;
      }
      if (value.length < 6 || value.length > 20) {
        setError('password', '密码长度需为 6-20 位');
        return false;
      }
      clearError('password');
      return true;
    }

    function validateConfirm() {
      const value = confirmPassword.value;
      if (!value) {
        setError('confirm', '请再次输入密码');
        return false;
      }
      if (value !== password.value) {
        setError('confirm', '两次输入的密码不一致');
        return false;
      }
      clearError('confirm');
      return true;
    }

    phone.addEventListener('blur', validatePhone);
    password.addEventListener('blur', validatePassword);
    confirmPassword.addEventListener('blur', validateConfirm);

    [phone, password, confirmPassword].forEach((input) => {
      input.addEventListener('input', () => {
        if (input === phone) {
          duplicatePhone = false;
        }
        clearError(input.id === 'confirmPassword' ? 'confirm' : input.id);
      });
    });

    document.querySelectorAll('.eye-btn').forEach((button) => {
      button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.target);
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        button.classList.toggle('is-visible', isPassword);
        button.setAttribute('aria-label', isPassword ? '隐藏密码' : '显示密码');
      });
    });

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        toast.classList.remove('show');
      }, 1800);
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const valid = validatePhone() && validatePassword() && validateConfirm();
      if (!valid) {
        return;
      }
      if (!agreement.checked) {
        showToast('请先阅读并同意用户协议');
        return;
      }
      submitBtn.disabled = true;
      submitBtn.classList.add('is-loading');
      submitText.textContent = '注册中...';
      window.setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.classList.remove('is-loading');
        submitText.textContent = '注册';
        showToast('注册成功，请前往登录');
      }, 1200);
    });

    if (params.get('state') === 'error') {
      duplicatePhone = true;
      phone.value = '13800138000';
      password.value = '123';
      confirmPassword.value = '456';
      validatePhone();
      validatePassword();
      validateConfirm();
    }

    if (params.get('state') === 'loading') {
      phone.value = '13800138000';
      password.value = 'abc123456';
      confirmPassword.value = 'abc123456';
      agreement.checked = true;
      submitBtn.disabled = true;
      submitBtn.classList.add('is-loading');
      submitText.textContent = '注册中...';
    }
  </script>
</body>
</html>
