<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1">
  <title>顾客首页</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="customer.css">
</head>
<body>
  <div class="screen">
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons" aria-hidden="true">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
          <rect x="0" y="7" width="3" height="4" rx="1" fill="#111827"/>
          <rect x="4.5" y="5" width="3" height="6" rx="1" fill="#111827"/>
          <rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#111827"/>
          <rect x="13.5" y="0" width="3" height="11" rx="1" fill="#111827"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <path d="M1 4.5C3 2.5 5.3 1.5 8 1.5C10.7 1.5 13 2.5 15 4.5" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M3.5 7C4.9 5.7 6.3 5 8 5C9.7 5 11.1 5.7 12.5 7" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="8" cy="9.8" r="1.2" fill="#111827"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
          <rect x="0.5" y="1" width="21" height="10" rx="3" stroke="#111827" stroke-opacity="0.4"/>
          <rect x="2" y="2.5" width="17" height="7" rx="1.8" fill="#111827"/>
          <path d="M23 4V8C23.8 7.7 24.3 7 24.3 6C24.3 5 23.8 4.3 23 4Z" fill="#111827" fill-opacity="0.4"/>
        </svg>
      </div>
    </div>

    <main class="page home-page">
      <div class="home-header">
        <div class="home-top">
          <div class="location">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21S5 14.5 5 9.5C5 5.9 8.1 3 12 3C15.9 3 19 5.9 19 9.5C19 14.5 12 21 12 21Z"/>
              <circle cx="12" cy="9.5" r="2.2"/>
            </svg>
            当前位置：XX 大学
          </div>
          <div class="icon-btn" aria-label="消息">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8C18 5.2 15.3 3 12 3C8.7 3 6 5.2 6 8C6 13 4 14 4 14H20C20 14 18 13 18 8Z"/>
              <path d="M9.5 17.5C10 18.4 10.9 19 12 19C13.1 19 14 18.4 14.5 17.5"/>
            </svg>
          </div>
        </div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="11" cy="11" r="6.5"/>
            <path d="M16 16L20 20"/>
          </svg>
          搜索店铺、菜品
        </div>
        <div class="chips">
          <span class="chip active">全部</span>
          <span class="chip">快餐</span>
          <span class="chip">奶茶</span>
          <span class="chip">面食</span>
          <span class="chip">甜点</span>
        </div>
      </div>

      <div class="banner">
        <div>
          <h3>新人专享</h3>
          <p>首单立减 5 元，今天吃点好的</p>
        </div>
        <span>去使用</span>
      </div>

      <div class="section-head">
        <h2>附近商家</h2>
        <span>综合排序</span>
      </div>

      <div class="store-list">
        <div class="store-card">
          <div class="store-logo" style="background: linear-gradient(135deg, #FF9A2E, #FF6B2C);">川</div>
          <div class="store-info">
            <div class="store-title">
              <h3>川味小厨</h3>
              <span class="status">营业中</span>
            </div>
            <div class="store-meta">
              <span>评分 4.8</span>
              <span>月售 1200+</span>
              <span>30 分钟</span>
              <span>配送费 ¥2</span>
            </div>
            <div class="store-tags">
              <span>满 30 减 5</span>
              <span>新客立减</span>
            </div>
          </div>
        </div>

        <div class="store-card resting">
          <div class="store-logo" style="background: linear-gradient(135deg, #34D399, #0E9F6E);">茶</div>
          <div class="store-info">
            <div class="store-title">
              <h3>茶百味</h3>
              <span class="status resting">休息中</span>
            </div>
            <div class="store-meta">
              <span>评分 4.7</span>
              <span>月售 800+</span>
              <span>25 分钟</span>
              <span>配送费 ¥1.5</span>
            </div>
            <div class="store-tags">
              <span>第二杯半价</span>
            </div>
          </div>
        </div>

        <div class="store-card">
          <div class="store-logo" style="background: linear-gradient(135deg, #60A5FA, #2563EB);">堡</div>
          <div class="store-info">
            <div class="store-title">
              <h3>麦香汉堡</h3>
              <span class="status">营业中</span>
            </div>
            <div class="store-meta">
              <span>评分 4.6</span>
              <span>月售 600+</span>
              <span>35 分钟</span>
              <span>配送费 ¥3</span>
            </div>
            <div class="store-tags">
              <span>满 25 减 3</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a class="nav-item active" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3L21 10.5V20H14V14H10V20H3V10.5Z"/>
        </svg>
        <span>首页</span>
      </a>
      <a class="nav-item" href="orders.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="3" width="14" height="18" rx="2"/>
          <path d="M8 8H16M8 12H16M8 16H13"/>
        </svg>
        <span>订单</span>
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.5"/>
          <path d="M5 20C5.5 16.5 8.2 14.5 12 14.5C15.8 14.5 18.5 16.5 19 20"/>
        </svg>
        <span>我的</span>
      </a>
    </nav>
  </div>
</body>
</html>
